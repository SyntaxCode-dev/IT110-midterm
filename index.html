<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Weather Tracker (Location-Based)</h2>

    <button id="locationBtn">Use My Current Location</button>

    <br><br>

    <input type="text" id="city" placeholder="Enter city (e.g., Manila)">
    <button id="checkWeatherBtn">Check Weather</button>
    <button id="clearBtn">Clear</button>

    <div id="result"></div>

    <script src="app.js"></script>
</body>
</html>
